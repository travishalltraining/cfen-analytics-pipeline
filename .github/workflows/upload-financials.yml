name: Upload Financials to BigQuery

on:
  push:
    paths:
      - 'financials/**.xlsx'
      - 'financials/**.xls'

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl pandas google-cloud-bigquery google-auth

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload changed financial files
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'financials/*.xlsx' 'financials/*.xls' 2>/dev/null)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(ls financials/*.xlsx financials/*.xls 2>/dev/null || echo "")
          fi

          if [ -z "$CHANGED" ]; then
            echo "No financial files found"
            exit 0
          fi

          for file in $CHANGED; do
            echo "Processing: $file"
            YEAR=$(echo "$file" | grep -oE '20[0-9]{2}' | head -1)
            if [ -z "$YEAR" ]; then
              YEAR="2026"
            fi
            echo "Detected year: $YEAR"
            REPORT_YEAR=$YEAR python scripts/upload_financials.py "$file"
          done

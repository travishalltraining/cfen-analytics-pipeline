name: Upload Financials to BigQuery

on:
  push:
    paths:
      - 'financials/**.xlsx'
      - 'financials/**.xls'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl pandas google-cloud-bigquery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Upload changed financial files
        run: |
          for file in $(git diff --name-only HEAD~1 HEAD -- 'financials/*.xlsx' 'financials/*.xls' 2>/dev/null || ls financials/*.xlsx financials/*.xls 2>/dev/null); do
            echo "Processing: $file"
            # Extract year from filename (e.g. financials/2025_PnL.xlsx -> 2025)
            YEAR=$(echo "$file" | grep -oE '20[0-9]{2}' | head -1 || echo "2026")
            echo "Detected year: $YEAR"
            REPORT_YEAR=$YEAR python scripts/upload_financials.py "$file"
          done

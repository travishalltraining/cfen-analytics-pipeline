name: Upload Financials to BigQuery

on:
  push:
    paths:
      - 'financials/**.xlsx'
      - 'financials/**.xls'

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl pandas google-cloud-bigquery google-auth

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload financial files
        run: |
          # Try to get changed files, fall back to all xlsx files in financials/
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'financials/' 2>/dev/null | grep -E '\.(xlsx|xls)$' || true)

          if [ -z "$CHANGED" ]; then
            echo "No changed files detected via git diff, processing all files in financials/"
            CHANGED=$(find financials/ -name "*.xlsx" -o -name "*.xls" 2>/dev/null || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No financial files found in financials/"
            exit 0
          fi

          echo "Files to process:"
          echo "$CHANGED"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Processing: $file"
            YEAR=$(echo "$file" | grep -oE '20[0-9]{2}' | head -1)
            [ -z "$YEAR" ] && YEAR="2026"
            echo "Year: $YEAR"
            REPORT_YEAR=$YEAR python scripts/upload_financials.py "$file"
          done <<< "$CHANGED"

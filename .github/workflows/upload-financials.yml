name: Upload Financials to BigQuery

on:
  push:
    paths:
      - 'financials/**.xlsx'
      - 'financials/**.xls'

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl google-cloud-bigquery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Upload financial files
        env:
          GCP_PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
        run: |
          set -e
          echo "Looking for xlsx files in financials/..."
          ls -la financials/ || echo "financials/ folder not found"

          for file in financials/*.xlsx financials/*.xls; do
            [ -f "$file" ] || continue
            echo "Processing: $file"
            YEAR=$(echo "$file" | grep -oE '20[0-9]{2}' | head -1)
            [ -z "$YEAR" ] && YEAR="2026"
            echo "Year: $YEAR"
            REPORT_YEAR=$YEAR python scripts/upload_financials.py "$file"
          done
